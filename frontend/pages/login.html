<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOBILE OTP AUTHENTICATION // DIGICART</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .otp-input-group {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
    }
    .sms-simulation-banner {
      background: rgba(16, 185, 129, 0.12);
      border: 1px dashed #10b981;
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      margin: 1rem 0;
      color: #34d399;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }
    .phone-prefix-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .country-code-badge {
      background: var(--bg-paper-light);
      border: 1px solid var(--border-paper-strong);
      color: var(--evergreen-dark);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.75rem 0.85rem;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="main-container auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="mono-spec" style="font-size: 0.75rem; color: var(--text-subtle);">[SYS // MOBILE OTP AUTH]</div>
        <h1 class="auth-title">Mobile Access</h1>
        <p class="auth-subtitle">Sign in using your mobile phone number and instant OTP code</p>
      </div>

      <!-- Step 1: Mobile Phone Entry -->
      <form id="auth-step-1" onsubmit="handleSendOtp(event)">
        <div class="form-group">
          <label class="form-label" for="login-phone">MOBILE PHONE NUMBER</label>
          <div class="phone-prefix-wrap">
            <span class="country-code-badge">📱 +91 / 🇮🇳</span>
            <input 
              type="tel" 
              id="login-phone" 
              name="phone" 
              class="form-control" 
              placeholder="e.g. 9876543210" 
              required 
              style="font-family: var(--font-mono); font-size: 1.05rem; letter-spacing: 1px;"
            />
          </div>
        </div>

        <button type="submit" id="send-otp-btn" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
          SEND OTP →
        </button>
      </form>

      <!-- Step 2: OTP Verification (Hidden initially) -->
      <form id="auth-step-2" style="display: none;" onsubmit="handleVerifyOtpSubmit(event)">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem;">
          <span class="mono-spec" style="font-size: 0.8rem; color: var(--evergreen-text);">[OTP VERIFICATION]</span>
          <button type="button" onclick="backToStep1()" style="background: none; border: none; color: var(--lime-accent); font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer; text-decoration: underline;">
            ← Change Number
          </button>
        </div>

        <!-- Simulated SMS Alert Banner -->
        <div id="simulated-sms-box" class="sms-simulation-banner" style="display: none;">
          <div style="font-weight: bold; margin-bottom: 0.25rem;">[📱 SIMULATED SMS RECEIVED]</div>
          <div>Your digiCart login OTP code is: <span id="otp-code-display" style="font-weight: 900; font-size: 1.1rem; color: #ffffff; text-decoration: underline;">------</span></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-otp">ENTER 6-DIGIT OTP</label>
          <input 
            type="text" 
            id="login-otp" 
            name="otp" 
            class="form-control" 
            placeholder="e.g. 582914" 
            maxlength="6" 
            required 
            style="font-family: var(--font-mono); font-size: 1.4rem; letter-spacing: 8px; text-align: center; font-weight: 700;"
          />
        </div>

        <button type="submit" id="verify-otp-btn" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
          VERIFY OTP & SIGN IN →
        </button>

        <div style="text-align: center; margin-top: 1rem;">
          <button type="button" id="resend-otp-btn" onclick="handleSendOtp()" class="btn-outline" style="font-size: 0.78rem; padding: 0.35rem 0.75rem;">
            RESEND OTP
          </button>
        </div>
      </form>

      <div class="demo-credentials" style="margin-top: 2rem;">
        <div style="font-weight: 700; color: var(--lime-accent); margin-bottom: 0.5rem; font-size: 0.8rem;">[PRE-SET DEMO MOBILE NUMBERS]</div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button type="button" onclick="quickLoginWithPhone('9876543210')" class="demo-btn" style="text-align: left; padding: 0.5rem 0.75rem;">
            ⚡ CUSTOMER DEMO (9876543210) — Instant OTP
          </button>
          <button type="button" onclick="quickLoginWithPhone('9999999999')" class="demo-btn" style="text-align: left; padding: 0.5rem 0.75rem;">
            ⚙ ADMIN SYSTEM DEMO (9999999999) — Instant OTP
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted);">
        NEW USER? <a href="/pages/register.html" style="color: var(--evergreen-dark); font-weight: 700; text-decoration: underline;">REGISTER MOBILE ACCOUNT</a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
