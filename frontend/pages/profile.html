<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPERATOR PROFILE // DIGICART</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="main-container auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="mono-spec" style="font-size: 0.75rem; color: var(--text-subtle);">[SYS // OPERATOR CREDENTIALS]</div>
        <h1 class="auth-title">Profile Telemetry</h1>
        <p class="auth-subtitle">Update personal credentials and authorization data</p>
      </div>

      <form id="profile-form" onsubmit="handleProfileUpdateSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="prof-name">OPERATOR NAME</label>
          <input type="text" id="prof-name" name="name" class="form-control" placeholder="Name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="prof-phone">REGISTERED MOBILE NUMBER</label>
          <input type="text" id="prof-phone" name="phone" class="form-control" style="font-family: var(--font-mono);" required />
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">UPDATE CREDENTIALS →</button>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getAuthUser();
      if (user) {
        document.getElementById('prof-name').value = user.name || '';
        document.getElementById('prof-phone').value = user.phone || '';
      } else {
        window.location.href = '/pages/login.html';
      }
    });
  </script>
</body>
</html>
